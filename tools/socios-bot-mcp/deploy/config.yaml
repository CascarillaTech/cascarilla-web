# Copiar á RAÍZ do volume hermes_socios_data — /opt/data/config.yaml dentro
# do contedor (NON nun subcartafol "socios/"; verificado en despregue real
# que esta imaxe non usa subcartafoles por perfil, o propio /opt/data xa é
# o perfil). Sobrescribe o config.yaml que Hermes xera automaticamente na
# primeira arrancada.
#
# Verificar os nomes exactos de toolsets con `hermes tools` antes do primeiro
# arranque real — esta lista sae da documentación pero pode variar de
# versión.

model:
  provider: openrouter
  # OLLO: a clave chámase "default", non "model" — Hermes migra
  # automaticamente model.model → model.default no seu schema (visto en
  # despregue real, versión de schema 46), pero mellor poñelo xa co nome
  # correcto. Modelo gratis (sufixo ":free"), verificado a man en
  # openrouter.ai o 2026-09-25 — 27B, 262K contexto, pensado tamén para
  # "long-running agent tasks". O catálogo gratis rota, así que confirma que
  # segue existindo en https://openrouter.ai/models?max_price=0 antes do
  # primeiro arranque.
  default: qwen/qwen3.8-27b:free

# Os modelos ":free" de OpenRouter comparten grupo de uso entre TODOS os
# usuarios de OpenRouter — pódese saturar (HTTP 429) sen que teñamos nada
# que ver co noso propio límite de conta. Con isto, se o modelo principal
# está saturado, Hermes proba estes por orde automaticamente. Tódolos
# verificados a man en openrouter.ai o 2026-09-25.
fallback_providers:
  - provider: openrouter
    model: nvidia/nemotron-3.5-lightning:free
  - provider: openrouter
    model: nvidia/nemotron-3-ultra-550b-a55b:free
  - provider: openrouter
    model: poolside/laguna-s-2.1:free
  - provider: openrouter
    model: inclusionai/ling-3.0-flash-fin:free
  - provider: openrouter
    model: dots-studio/dots-3-note-preview:free

agent:
  # Bloquea todo o que este bot NON necesita. É un bot de cara ao público
  # (calquera pode escribirlle en Telegram), non un asistente persoal — nada
  # de navegador, terminal, ficheiros, xeración de imaxe, etc.
  disabled_toolsets:
    - web
    - search
    - terminal
    - file
    - browser
    - vision
    - image_gen
    - skills
    - tts
    - todo
    - session_search
    - cronjob
    - code_execution
    - delegation
    - homeassistant
    - spotify
    - discord
    - discord_admin
    - debugging

telegram:
  # Desactivado por defecto en Hermes. Con isto activo, o bot marca cada
  # mensaxe cunha reacción 👀 en canto empeza a procesala, e a cambia por
  # 👍/👎 cando remata — así queda claro que está a facer algo mentres
  # espera resposta do modelo (pode tardar, sobre todo se ten que probar
  # varios modelos de fallback).
  reactions: true

mcp_servers:
  socios:
    command: "node"
    args: ["/opt/socios-bot-mcp/index.js"]
    # OLLO: non confirmei se este config.yaml soporta interpolación de
    # variables de ambiente (${VAR}) — a documentación só amosa valores
    # literais. Para ir sobre seguro, pon aquí os valores REAIS directamente
    # (a URL do Apps Script e o mesmo BOT_TOKEN que puxeches nas Propiedades
    # do script). Este ficheiro vive só no volume do contedor no VPS, nunca
    # no repo, así que non hai problema en que leve os segredos en claro.
    env:
      APPS_SCRIPT_URL: "https://script.google.com/macros/s/XXXX/exec"
      BOT_TOKEN: "o-mesmo-segredo-que-en-Propiedades-do-script"
