<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Imagen LinkedIn — Buscamos empresas colaboradoras (Un día con IA)</title>
<!-- 1200×627 (formato recomendado para imagen de post en LinkedIn).
     Render: msedge --headless --screenshot=... --window-size=1200,627 <este html> -->
<style>
@font-face{font-family:'PFI';src:url('../fonts/PlayfairDisplay-Italic.ttf');font-style:italic}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:627px;overflow:hidden;background:#f0e2b6;font-family:'Segoe UI',Roboto,Arial,sans-serif;color:#382117}
.canvas{position:relative;width:1200px;height:627px}
.logo-ct{position:absolute;left:70px;top:36px;height:62px}
.logo-jug{position:absolute;right:70px;top:36px;height:56px}
.kicker{position:absolute;left:70px;top:128px;font-family:'PFI',serif;font-style:italic;font-size:28px;color:#8C4B33}
h1{position:absolute;left:70px;top:168px;width:690px;font-size:58px;line-height:1.08;font-weight:700;text-shadow:0 3px 8px rgba(56,33,23,.18)}
.hl{position:absolute;left:72px;top:300px;width:420px;height:12px;background:#B8863B;opacity:.85;border-radius:6px 14px 8px 12px/10px 6px 12px 8px;transform:rotate(-.6deg)}
ul{position:absolute;left:70px;top:338px;width:700px;list-style:none}
li{font-size:25px;line-height:1.25;margin-bottom:15px;padding-left:34px;position:relative}
li::before{content:"";position:absolute;left:0;top:7px;width:16px;height:16px;border-radius:50%;background:#8C4B33;box-shadow:0 0 0 4px rgba(140,75,51,.18)}
.hex-wrap{position:absolute;right:92px;top:118px;width:300px;height:300px}
.hex{position:absolute;inset:0;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:#fff}
.hex img{position:absolute;left:-10%;top:-8%;width:122%;height:auto;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.hex-in{position:absolute;inset:7px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);overflow:hidden;background:#eeeeef}
.hex-in img{position:absolute;width:400px;left:-50px;top:12px;clip-path:none}
.with{position:absolute;right:70px;top:440px;width:340px;text-align:center}
.with p{font-family:'PFI',serif;font-style:italic;font-size:22px;color:#6B3622;margin-bottom:8px}
.with img{height:46px}
.row{display:flex;align-items:center;justify-content:center;gap:10px}
.slot{width:62px;height:46px;border:2px dashed rgba(140,75,51,.45);border-radius:8px}
footer{position:absolute;left:0;bottom:0;width:100%;height:80px;background:#382117;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 70px;font-size:26px}
footer b{color:#f0e2b6;font-weight:600}
</style></head><body>
<div class="canvas">
  <img class="logo-ct" src="../images/cascarillatech-logo.svg" alt="">
  <img class="logo-jug" src="../images/poster/organizers/corunajug-logo.png" alt="">
  <p class="kicker">Un día con IA · 21 de noviembre</p>
  <h1>Seguimos buscando empresas colaboradoras</h1>
  <div class="hl"></div>
  <ul>
    <li>Para hacer crecer el ecosistema tecnológico de A Coruña</li>
    <li>Porque este evento merece la pena</li>
    <li>Para que la gente y las empresas conecten</li>
  </ul>
  <div class="hex-wrap"><div class="hex"></div><div class="hex-in"><img src="../images/un-dia-con-ia-robot.jpg" alt=""></div></div>
  <div class="with"><p>Ya nos acompaña</p><div class="row"><img src="../images/poster/sponsors/odeene-color-horizontal.png" alt="Odeene"><img src="../images/poster/sponsors/bahia-software-color.png" alt="Bahía Software"><span class="slot"></span></div></div>
  <footer><span>Cidade das TIC · A Coruña</span><b>cascarillatech.org/dossier/one-ai-day</b></footer>
</div></body></html>
