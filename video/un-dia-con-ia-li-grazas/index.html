<!doctype html>
<html lang="gl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Un día con IA — grazas ás colaboradoras</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  :root {
    --cream: #f0e2b6; --primary: #8C4B33; --secondary: #6B3622;
    --dark: #382117; --deep: #140a05; --ochre: #B8863B; --gold: #e8b45a;
  }
  html, body { margin: 0; background: var(--deep); }
  body { font-family: system-ui, sans-serif; color: var(--cream); }
  #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--deep); }
  .abs { position: absolute; }
  .full { position: absolute; inset: 0; }
  .hexclip { clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%); }

  #grid { inset: -200px; background-image:
      linear-gradient(rgba(232,180,90,.09) 2px, transparent 2px),
      linear-gradient(90deg, rgba(232,180,90,.09) 2px, transparent 2px);
    background-size: 90px 90px; }
  #glow { width: 1400px; height: 1400px; left: -160px; top: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(184,134,59,.45) 0%, rgba(140,75,51,.18) 40%, transparent 70%); }
  #vignette { background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.75) 100%); }
  .particle { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 18px var(--gold); }
  #flash { background: var(--cream); }
  #s2, #s3, #s4, #flash, .spn { opacity: 0; }

  /* 1: robot + "non sería posible sen..." */
  #s1 { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #robotwrap { position: relative; width: 560px; height: 560px; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 6px dashed rgba(232,180,90,.7); }
  #r1b { inset: -70px; border: 3px solid rgba(232,180,90,.35); border-top-color: var(--gold); border-right-color: var(--gold); }
  #robot { position: absolute; inset: 45px; background: linear-gradient(135deg, var(--gold), var(--primary)); }
  #robot img { position: absolute; inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); object-fit: cover; }
  #s1-title { margin-top: 140px; display: flex; gap: 28px; font-size: 130px; font-weight: 900; line-height: 1; }
  .w { display: block; }
  .w.hot { background: linear-gradient(90deg, var(--gold), #f59e42, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #s1-sub { margin-top: 60px; font-size: 60px; font-weight: 700; text-align: center; padding: 0 90px; line-height: 1.25; }

  /* 2: unha colaboradora por pantalla */
  #s2-head { position: absolute; left: 0; right: 0; top: 200px; text-align: center; font-size: 62px; font-weight: 900; letter-spacing: 4px; }
  #s2-head span { color: var(--gold); }
  .spn { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 60px; box-sizing: border-box; }
  .spn .card { width: 820px; height: 520px; border-radius: 48px; background: var(--cream); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 6px var(--gold), 0 0 120px rgba(232,180,90,.55); }
  .spn .card img { max-width: 640px; max-height: 360px; object-fit: contain; }
  .spn .tag { margin-top: 80px; font-size: 40px; font-weight: 900; letter-spacing: 8px; color: var(--deep); background: var(--gold); padding: 12px 36px; border-radius: 40px; text-transform: uppercase; }
  .spn .thx { margin-top: 90px; font-size: 104px; font-weight: 900; text-align: center; line-height: 1.05; padding: 0 50px; }
  .spn .line { margin-top: 30px; font-size: 48px; font-weight: 600; text-align: center; line-height: 1.25; padding: 0 110px; opacity: .9; }
  .burst { opacity: 0; position: absolute; left: 540px; top: 760px; width: 22px; height: 22px; border-radius: 4px; }
  #counter { position: absolute; left: 0; right: 0; top: 1740px; display: flex; justify-content: center; gap: 22px; }
  #counter i { width: 90px; height: 10px; border-radius: 5px; background: rgba(232,180,90,.25); }
  #counter i b { display: block; height: 100%; width: 100%; border-radius: 5px; background: var(--gold); transform-origin: left center; }

  /* 3: grande "Moitas grazas!" */
  #s3 { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #s3-big { font-size: 190px; font-weight: 900; line-height: .95; text-align: center; }
  #s3-big .hot { display: block; padding-bottom: 24px; }
  #s3-heart { font-size: 200px; margin-top: 60px; }

  /* 4: cartel final */
  #s4 { background: var(--cream); color: var(--dark); display: flex; flex-direction: column; align-items: center; }
  #s4-logos { display: flex; justify-content: space-between; width: 920px; margin-top: 80px; }
  #s4-logos img { height: 130px; }
  #s4-title { margin-top: 120px; font-size: 150px; font-weight: 900; text-align: center; line-height: 1; }
  #s4-ul { width: 560px; height: 14px; background: var(--ochre); border-radius: 7px; margin-top: 34px; transform-origin: left center; }
  #s4-sub { margin-top: 50px; font-size: 52px; font-weight: 800; text-align: center; padding: 0 80px; line-height: 1.25; }
  #s4-sp { margin-top: 80px; display: flex; flex-direction: column; align-items: center; gap: 60px; }
  #s4-sp img { display: block; }
  #s4-sp .o { height: 150px; }
  #s4-sp .row { display: flex; gap: 90px; align-items: center; }
  #s4-sp .b { height: 150px; }
  #s4-sp .t { height: 190px; }
  #s4-date { position: absolute; left: 0; right: 0; bottom: 330px; text-align: center; font-size: 80px; font-weight: 900; color: var(--primary); }
  #s4-foot { position: absolute; left: 0; right: 0; bottom: 0; height: 290px; background: var(--dark); color: var(--cream);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
  #s4-venue { font-size: 46px; font-weight: 700; }
  #s4-cta { font-size: 48px; font-weight: 900; color: var(--dark); background: var(--gold); padding: 18px 50px; border-radius: 60px; }
  /* ---- LinkedIn apaisado 1920x1080 ---- */
  #glow { left: 260px; top: -160px; }

  #robotwrap { width: 400px; height: 400px; }
  #r1b { inset: -50px; }
  #robot { inset: 35px; }
  #s1-title { margin-top: 90px; font-size: 120px; }
  #s1-sub { margin-top: 40px; font-size: 56px; }
  #s2-head { top: 70px; }
  .spn { display: grid; grid-template-columns: 760px 880px; grid-template-rows: auto auto; column-gap: 90px;
    align-content: center; justify-content: center; justify-items: start; padding-top: 40px; }
  .spn .card { width: 740px; height: 470px; grid-row: 1 / 3; align-self: center; }
  .spn .card img { max-width: 580px; max-height: 320px; }
  .spn .thx { margin-top: 0; text-align: left; padding: 0; align-self: end; font-size: 100px; }
  .spn .line { text-align: left; padding: 0; align-self: start; }
  .burst { left: 495px; top: 560px; }
  #counter { top: 990px; }
  #s3-big { font-size: 170px; }
  #s3-heart { font-size: 160px; margin-top: 30px; }
  #s4 { display: block; }
  #s4 > * { position: absolute; }
  #s4-logos { left: 70px; top: 40px; width: 1780px; margin: 0; }
  #s4-logos img { height: 110px; }
  #s4-title { left: 100px; top: 230px; margin: 0; font-size: 140px; text-align: left; }
  #s4-ul { left: 104px; top: 390px; margin: 0; }
  #s4-sub { left: 100px; top: 440px; margin: 0; padding: 0; text-align: left; width: 800px; }
  #s4-date { left: 100px; right: auto; top: 640px; bottom: auto; text-align: left; }
  #s4-sp { left: 1060px; top: 210px; width: 760px; margin: 0; gap: 70px; }
  #s4-foot { height: 170px; flex-direction: row; gap: 80px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="24">
  <div id="bg" class="full">
    <div id="grid" class="abs"></div>
    <div id="glow" class="abs"></div>
    <div id="particles" class="full"></div>
    <div id="vignette" class="full"></div>
  </div>

  <div id="s1" class="full">
    <div id="robotwrap">
      <div id="r1b" class="ring"></div>
      <div id="r1a" class="ring"></div>
      <div id="robot" class="hexclip"><img class="hexclip" src="assets/un-dia-con-ia-robot.jpg" alt="" /></div>
    </div>
    <div id="s1-title"><span class="w">Un</span><span class="w">día</span><span class="w">con</span><span class="w hot">IA</span></div>
    <div id="s1-sub">non sería posible sen…</div>
  </div>

  <div id="s2" class="full">
    <div id="s2-head">EMPRESAS <span>COLABORADORAS</span></div>
    <div id="spns" class="full"></div>
    <div id="bursts" class="full"></div>
    <div id="counter"><i><b></b></i><i><b></b></i><i><b></b></i></div>
  </div>

  <div id="s3" class="full">
    <div id="s3-big">Moitas<span class="w hot">grazas!</span></div>
    <div id="s3-heart">🧡</div>
  </div>

  <div id="flash" class="full"></div>

  <div id="s4" class="full">
    <div id="s4-logos"><img src="assets/corunajug-logo.png" alt="" /><img src="assets/cascarillatech-logo.png" alt="" /></div>
    <div id="s4-title">Un día con IA</div>
    <div id="s4-ul"></div>
    <div id="s4-sub">Grazas ás empresas que o fan posible</div>
    <div id="s4-sp">
      <img class="o" src="assets/odeene-color-horizontal.png" alt="" />
      <div class="row"><img class="b" src="assets/bahia-software-color.png" alt="" /><img class="t" src="assets/3mt-global-services.png" alt="" /></div>
    </div>
    <div id="s4-date">21 · NOV · 2026</div>
    <div id="s4-foot">
      <div id="s4-venue">📍 Cidade das TIC · A Coruña</div>
      <div id="s4-cta">Entradas: 30 € con xantar · link na bio</div>
    </div>
  </div>
</div>

<script>
  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const parts = document.getElementById('particles');
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'particle abs';
    d.style.left = (rnd() * 1920) + "px";
    d.style.top = (rnd() * 1080) + "px";
    d.dataset.dy = String(-200 - rnd() * 500);
    d.dataset.o = String(.25 + rnd() * .6);
    parts.appendChild(d);
  }

  const sponsors = [
    ['odeene-color-horizontal.png', 'Primeira colaboradora', 'Grazas, Odeene!', 'Confiaron en nós e acóllennos nas súas oficinas'],
    ['bahia-software-color.png', 'Colaboradora', 'Grazas, Bahía Software!', 'Consultora galega de desenvolvemento tecnolóxico'],
    ['3mt-global-services.png', 'Colaboradora', 'Grazas, 3MT Global Services!', 'Partner boutique coruñés de Salesforce'],
  ];
  const spns = document.getElementById('spns');
  const spnEls = sponsors.map(([img, tag, thx, line]) => {
    const el = document.createElement('div');
    el.className = 'spn full';
    el.innerHTML = `<div class="card"><img src="assets/${img}" alt="" /></div>
      <div class="thx">${thx}</div><div class="line">${line}</div>`;
    spns.appendChild(el);
    return el;
  });
  // confeti determinista: un estoupido por colaboradora
  const colors = ['#e8b45a', '#f59e42', '#f0e2b6', '#8C4B33', '#ef6f9a', '#4ea3e6'];
  const bursts = document.getElementById('bursts');
  const burstSets = sponsors.map(() => {
    const set = [];
    for (let i = 0; i < 28; i++) {
      const c = document.createElement('div');
      c.className = 'burst';
      c.style.background = colors[i % colors.length];
      const a = rnd() * Math.PI * 2, r = 380 + rnd() * 420;
      c.dataset.x = String(Math.cos(a) * r);
      c.dataset.y = String(Math.sin(a) * r * 1.2);
      c.dataset.rot = String(rnd() * 720 - 360);
      bursts.appendChild(c);
      set.push(c);
    }
    return set;
  });

  const tl = gsap.timeline({ paused: true });
  const D = 24;

  

  tl.fromTo('#grid', { y: 0, rotation: 0 }, { y: 200, rotation: 4, duration: D, ease: 'none' }, 0);
  tl.fromTo('#glow', { scale: .8, opacity: .6 }, { scale: 1.25, opacity: 1, duration: D / 2, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
  document.querySelectorAll('#particles .particle').forEach((p) => {
    tl.fromTo(p, { y: 0, opacity: 0 }, { y: +p.dataset.dy, opacity: +p.dataset.o, duration: D, ease: 'none' }, 0);
  });

  // 1 (0–4.2): robot + "non sería posible sen…"
  tl.fromTo('#robot', { scale: .1, rotation: -160 }, { scale: 1, rotation: 0, duration: .8, ease: 'back.out(1.5)' }, .1);
  tl.fromTo('#r1a', { rotation: 0, scale: .6, opacity: 0 }, { rotation: 300, scale: 1, opacity: 1, duration: 4, ease: 'power1.out' }, .1);
  tl.fromTo('#r1b', { rotation: 0, scale: .4, opacity: 0 }, { rotation: -420, scale: 1, opacity: 1, duration: 4, ease: 'power1.out' }, .2);
  tl.fromTo('#s1-title .w', { y: 160, opacity: 0, rotation: 8 }, { y: 0, opacity: 1, rotation: 0, duration: .5, ease: 'back.out(2)', stagger: .15 }, .7);
  tl.fromTo('#s1-title .w.hot', { backgroundPosition: '0% 0%' }, { backgroundPosition: '200% 0%', duration: 4, ease: 'none' }, .7);
  tl.fromTo('#s1-sub', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .6, ease: 'power3.out' }, 1.8);
  tl.to('#s1', { scale: 3, opacity: 0, duration: .5, ease: 'power3.in' }, 3.9);

  // 2 (4.4–13.7): colaboradoras, 3.1 s cada unha
  tl.to('#s2', { opacity: 1, duration: .01 }, 4.4);
  tl.fromTo('#s2-head', { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: 'power3.out' }, 4.4);
  const bars = document.querySelectorAll('#counter b');
  tl.set(bars, { scaleX: 0 }, 0);
  spnEls.forEach((el, i) => {
    const t = 4.55 + i * 3.1;
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .2 }, t);
    tl.fromTo(el.querySelector('.card'), { scale: 0, rotation: i % 2 ? 12 : -12 }, { scale: 1, rotation: 0, duration: .6, ease: 'back.out(1.8)' }, t);
    tl.fromTo(el.querySelector('.card img'), { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .45, ease: 'power3.out' }, t + .3);
    burstSets[i].forEach((c) => {
      tl.fromTo(c, { x: 0, y: 0, rotation: 0, opacity: 1, scale: 1 },
        { x: +c.dataset.x, y: +c.dataset.y, rotation: +c.dataset.rot, opacity: 0, scale: .5, duration: 1.3, ease: 'power3.out' }, t + .4);
    });
    tl.fromTo(el.querySelector('.thx'), { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: 'power3.out' }, t + .65);
    tl.fromTo(el.querySelector('.line'), { opacity: 0 }, { opacity: .9, duration: .4 }, t + .9);
    tl.to(bars[i], { scaleX: 1, duration: 2.9, ease: 'none' }, t);
    if (i < spnEls.length - 1) tl.to(el, { opacity: 0, scale: .85, duration: .35, ease: 'power3.in' }, t + 2.75);
  });
  tl.to('#s2', { scale: .6, opacity: 0, duration: .4, ease: 'power3.in' }, 13.5);

  // 3 (13.9–16.4): Moitas grazas!
  tl.to('#s3', { opacity: 1, duration: .01 }, 13.9);
  tl.fromTo('#s3-big', { scale: 2.4, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: 'back.out(1.6)' }, 13.9);
  tl.fromTo('#s3-big .hot', { backgroundPosition: '0% 0%' }, { backgroundPosition: '200% 0%', duration: 2.5, ease: 'none' }, 13.9);
  tl.fromTo('#s3-heart', { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: .5, ease: 'back.out(3)' }, 14.4);
  tl.to('#s3-heart', { scale: 1.2, duration: .25, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 15.0);
  tl.to('#s3', { y: -400, opacity: 0, duration: .4, ease: 'power3.in' }, 16.2);
  tl.to('#flash', { opacity: 1, duration: .12 }, 16.5);

  // 4 (16.6–24): cartel final → portada
  tl.to('#s4', { opacity: 1, duration: .01 }, 16.62);
  tl.to('#flash', { opacity: 0, duration: .4 }, 16.65);
  tl.fromTo('#s4-logos img', { y: -160, opacity: 0 }, { y: 0, opacity: 1, duration: .6, ease: 'back.out(2)', stagger: .13 }, 16.75);
  tl.fromTo('#s4-title', { scale: 1.5, opacity: 0 }, { scale: 1, opacity: 1, duration: .6, ease: 'power3.out' }, 16.9);
  tl.fromTo('#s4-ul', { scaleX: 0 }, { scaleX: 1, duration: .6, ease: 'power2.inOut' }, 17.4);
  tl.fromTo('#s4-sub', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .5 }, 17.7);
  tl.fromTo('#s4-sp img', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .55, ease: 'back.out(2)', stagger: .2 }, 18.1);
  tl.fromTo('#s4-date', { scale: 2.2, opacity: 0 }, { scale: 1, opacity: 1, duration: .55, ease: 'back.out(2)' }, 18.9);
  tl.fromTo('#s4-foot', { yPercent: 100 }, { yPercent: 0, duration: .6, ease: 'power3.out' }, 19.2);
  tl.fromTo('#s4-cta', { scale: 0 }, { scale: 1, duration: .5, ease: 'back.out(3)' }, 19.7);
  tl.to('#s4-cta', { scale: 1.08, duration: .3, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 20.5);

  window.__timelines['main'] = tl;
</script>
</body>
</html>
