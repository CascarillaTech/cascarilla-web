name: Desplegar Cascarilla Tech en GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  BUILD_PATH: '.'

jobs:
  build:
    name: Compilar proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
        with:
          # Historial completo: /feed.json saca o updatedAt de cada evento
          # da data do seu último commit (src/pages/feed.json.js).
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24 # LTS actual (coincide co Node local)
          cache: npm
          cache-dependency-path: ${{ env.BUILD_PATH }}/package-lock.json

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Instalar dependencias
        run: npm ci
        working-directory: ${{ env.BUILD_PATH }}

      - name: Compilar con Astro
        run: npm run build
        working-directory: ${{ env.BUILD_PATH }}

      - name: Subir artefacto compilado
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5